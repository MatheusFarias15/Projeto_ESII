{% extends 'base.html' %}

{% block title %}Login - Nexus ERP{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Nexus<span class="highlight">ERP</span></h2>
            <p>Acesse sua conta para continuar</p>
        </div>
        <form action="{{ url_for('login.login_view') }}" method="POST" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required placeholder="seu@email.com">
            </div>
            <div class="form-group password-group">
                <label for="password">Senha</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                    <button type="button" class="toggle-password" data-target="password">👁️</button>
                </div>
            </div>
            <button type="submit" class="btn-primary">Entrar</button>
        </form>
        <div class="auth-footer">
            <p>Não tem uma conta? <a href="{{ url_for('register.register_view') }}">Cadastre-se</a></p>
        </div>
    </div>
</div>
{% endblock %}
